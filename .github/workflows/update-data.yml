name: Update data

on:
  workflow_dispatch:          # "Run workflow" button
  schedule:
    - cron: "17 11 * * 1-5"   # weekdays ~6am Toronto, picks up new filings
  push:
    branches: [main]
    paths: ["pipeline/**", ".github/workflows/update-data.yml"]

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: Test the quarter math
        run: python -m pytest -q
      - name: Build data from SEC filings
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python -m pipeline.build
      - name: Commit data if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/quarterly.json data/checks.json
          if git diff --cached --quiet -- data/quarterly.json; then
            echo "No new numbers."
          else
            git commit -m "Update data from SEC filings"
            git push
          fi
